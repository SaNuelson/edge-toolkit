name: Release BGG Linker

on:
  push:
    tags:
      - "bgg-linker-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify extension
        run: |
          npm run typecheck
          npm test

      - name: Build release package
        run: npm run package:bgg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#bgg-linker-v}"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/bgg-linker-${version}.zip" \
            --title "BGG Linker ${version}" \
            --notes "Download and unzip the package. In Edge, open edge://extensions, enable Developer mode, choose Load unpacked, and select the extracted folder."
